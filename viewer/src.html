<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FS Audit Viewer</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --panel2:#f1f3f6; --line:#dfe3e8; --line2:#eceff3;
  --text:#1c2430; --muted:#66707d; --faint:#9aa3ad; --accent:#2f5bd3; --accent-bg:#e8eefc;
  --sel:#e3ebff; --hover:#f3f6fb;
  --l5:#c92a2a; --l4:#e8590c; --l3:#d39e00; --l2:#2b8a3e; --l1:#9aa3ad; --l0:#ced4da; --lu:#868e96;
  --deny:#9c36b5; --warn:#b35c00; --crit:#c92a2a; --info:#2f5bd3;
  --ca:#2f6fd8; --cb:#9c36b5;
  --mono: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171c; --panel:#1b1f26; --panel2:#222831; --line:#2f3640; --line2:#262c35;
    --text:#e4e8ee; --muted:#9aa4b1; --faint:#6b7480; --accent:#7ea2ff; --accent-bg:#233056;
    --sel:#25335a; --hover:#212833;
    --l5:#ff6b6b; --l4:#ff922b; --l3:#ffd43b; --l2:#51cf66; --l1:#6b7480; --l0:#3a414b; --lu:#868e96;
    --deny:#da77f2; --warn:#ffa94d; --crit:#ff6b6b; --info:#7ea2ff;
  }
}
:root[data-theme="dark"]{
    --bg:#14171c; --panel:#1b1f26; --panel2:#222831; --line:#2f3640; --line2:#262c35;
    --text:#e4e8ee; --muted:#9aa4b1; --faint:#6b7480; --accent:#7ea2ff; --accent-bg:#233056;
    --sel:#25335a; --hover:#212833;
    --l5:#ff6b6b; --l4:#ff922b; --l3:#ffd43b; --l2:#51cf66; --l1:#6b7480; --l0:#3a414b; --lu:#868e96;
    --deny:#da77f2; --warn:#ffa94d; --crit:#ff6b6b; --info:#7ea2ff;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent);cursor:pointer;text-decoration:none}
a:hover{text-decoration:underline}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh}
header.top{display:flex;align-items:center;gap:16px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);min-height:48px}
header .brand{font-weight:650;font-size:14px;white-space:nowrap}
header .meta{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.tabs{display:flex;gap:2px;margin-left:8px}
nav.tabs button{border:0;background:none;padding:7px 12px;border-radius:6px;color:var(--muted);font-weight:550}
nav.tabs button:hover{background:var(--hover);color:var(--text)}
nav.tabs button.on{background:var(--accent-bg);color:var(--accent)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);padding:5px 10px;border-radius:6px}
.btn:hover{background:var(--hover)}
.btn.small{padding:2px 8px;font-size:12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
main{min-height:0;position:relative}
.view{position:absolute;inset:0;display:none}
.view.on{display:grid}
/* loader */
#load{display:flex;align-items:center;justify-content:center;position:absolute;inset:0}
.dropzone{width:min(560px,92vw);border:2px dashed var(--line);border-radius:14px;padding:36px 28px;text-align:center;background:var(--panel)}
.dropzone.drag{border-color:var(--accent);background:var(--accent-bg)}
.dropzone h1{font-size:20px;margin:0 0 6px}
.dropzone p{color:var(--muted);margin:6px 0}
.dropzone .pick{margin-top:14px;display:inline-block;background:var(--accent);color:#fff;border:0;padding:9px 18px;border-radius:8px;font-weight:600}
#loadStatus{margin-top:14px;font-family:var(--mono);font-size:12px;color:var(--muted);white-space:pre-line;text-align:left}
/* layouts */
.v3{grid-template-columns:300px minmax(0,1fr) 0}
.v3.det{grid-template-columns:300px minmax(0,1fr) var(--detw,460px)}
.v2{grid-template-columns:minmax(0,1fr) 0}
.v2.det{grid-template-columns:minmax(0,1fr) var(--detw,460px)}
.col{min-height:0;min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--panel)}
.col.main{background:var(--bg)}
.col.detcol{position:relative}
.resizer{position:absolute;left:-4px;top:0;bottom:0;width:8px;cursor:col-resize;z-index:5}
.resizer::after{content:"";position:absolute;left:3px;top:0;bottom:0;width:2px;background:transparent;transition:background .15s}
.resizer:hover::after,.resizer.drag::after{background:var(--accent)}
body.resizing{cursor:col-resize;user-select:none}
table.t td{overflow-wrap:anywhere}
table.t td:first-child{overflow-wrap:normal;white-space:nowrap}
.backbtn{border:1px solid var(--line);background:var(--panel);width:28px;height:28px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;line-height:1;color:var(--muted);flex:none}
.backbtn:hover{background:var(--hover);color:var(--text)}
.abtag{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:5px;font-size:11px;font-weight:800;color:#fff;flex:none}
.abtag.a{background:var(--ca)}.abtag.b{background:var(--cb)}
.row .abtag{width:15px;height:15px;font-size:10px;border-radius:4px}
.fi.k1,.fi-dot.k1{background:var(--ca)}.fi.k2,.fi-dot.k2{background:var(--cb)}.fi.k3,.fi-dot.k3{background:var(--warn)}.fi.k4,.fi-dot.k4{background:var(--l0)}
.fi-dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 3px 0 8px}
.cmp-pick{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ppick{display:flex;gap:8px;align-items:center;flex:1;min-width:260px;max-width:460px}
.ppick .searchres{width:100%;top:calc(100% + 2px)}
.cmp-cards{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:8px}
.cmpc{border:1px solid var(--line);border-left:4px solid var(--l0);border-radius:8px;padding:6px 10px;cursor:pointer;background:var(--panel)}
.cmpc:hover{border-color:var(--accent)}
.cmpc.on{background:var(--sel)}
.cmpc b{font-size:17px;display:block}.cmpc span{font-size:12px;color:var(--text)}.cmpc small{display:block;color:var(--muted);font-size:11px}
.cmpc.k1{border-left-color:var(--ca)}.cmpc.k2{border-left-color:var(--cb)}.cmpc.k3{border-left-color:var(--warn)}
.chip.ca{border-color:var(--ca)}.chip.cb{border-color:var(--cb)}
.placeholder{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);text-align:center;padding:40px}
.placeholder .big{font-size:40px;opacity:.35}
.placeholder b{color:var(--text);font-size:15px;font-weight:600}
.col:last-child{border-right:0}
.scroll{overflow:auto;min-height:0;flex:1}
.pad{padding:12px 16px}
/* sidebar */
.side-head{padding:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.inp{width:100%;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--panel2)}
.inp:focus{outline:2px solid var(--accent-bg);border-color:var(--accent)}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;border:0;background:none;padding:4px 6px;font-size:12px;color:var(--muted)}
.seg button.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
.plist .pi{padding:6px 12px;border-bottom:1px solid var(--line2);cursor:pointer;display:flex;gap:8px;align-items:center}
.plist .pi:hover{background:var(--hover)}
.plist .pi.on{background:var(--sel)}
.pi .nm{flex:1;min-width:0}
.pi .nm b{font-weight:550;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi .nm small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none;background:var(--panel2);color:var(--muted)}
.ico.user{background:#e3ebff;color:#2f5bd3}.ico.group{background:#e6f4ea;color:#2b8a3e}.ico.wk{background:#fff4e0;color:#b35c00}.ico.orphan{background:#fde8e8;color:#c92a2a}.ico.computer{background:#eee;color:#555}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ico.user{background:#233056;color:#9db6ff}:root:not([data-theme="light"]) .ico.group{background:#1f3a28;color:#69db7c}:root:not([data-theme="light"]) .ico.wk{background:#3d2d14;color:#ffa94d}:root:not([data-theme="light"]) .ico.orphan{background:#40191c;color:#ff8787}}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:9px;background:var(--panel2);color:var(--muted);border:1px solid var(--line);white-space:nowrap;line-height:17px}
.tag.off{color:var(--crit);border-color:var(--crit);background:transparent}
.tag.deny{color:var(--deny);border-color:var(--deny);background:transparent}
.tag.inh{color:var(--warn);border-color:var(--warn);background:transparent}
.tag.err{color:var(--crit);border-color:var(--crit);background:transparent}
/* principal header */
.phead{padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:8px}
.phead h2{margin:0;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.phead .sub{color:var(--muted);font-size:12px}
.phead .row2{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.stat{display:flex;gap:6px;align-items:baseline}
.stat b{font-size:15px}
.stat span{color:var(--muted);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11.5px;padding:1px 8px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--accent)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.toolbar:empty{display:none}
.toolbar label{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px}
.toolbar select{padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel2)}
.searchwrap{position:relative}
.searchres{position:absolute;top:100%;left:0;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.15);max-height:420px;overflow:auto;width:min(720px,70vw);display:none}
.searchres.on{display:block}
.searchres div{padding:5px 10px;cursor:pointer;border-bottom:1px solid var(--line2);font-size:12px}
.searchres div:hover{background:var(--hover)}
.searchres .p{color:var(--muted);font-family:var(--mono);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* tree */
.tree{padding:6px 0 40px;font-size:13px}
.row{display:flex;align-items:center;gap:6px;padding:2px 10px 2px 0;white-space:nowrap;cursor:default;min-height:24px}
.row:hover{background:var(--hover)}
.row.sel{background:var(--sel)}
.row .tg{width:18px;height:18px;flex:none;border:0;background:none;padding:0;color:var(--faint);font-size:10px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px}
.row .tg:hover{background:var(--panel2);color:var(--text)}
.row .tg.none{visibility:hidden}
.row .fi{width:14px;height:11px;flex:none;border-radius:2px;background:var(--l0);position:relative;top:0}
.row .fi::before{content:"";position:absolute;left:0;top:-3px;width:6px;height:4px;border-radius:2px 2px 0 0;background:inherit}
.row .fn{cursor:pointer;overflow:hidden;text-overflow:ellipsis}
.row .fn:hover{text-decoration:underline}
.row.pass .fn{color:var(--faint)}
.row .via{color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis}
.row .cnt{color:var(--faint);font-size:11.5px}
.row.files{color:var(--muted);font-style:italic;cursor:default}
.row.files:hover{background:none}
.row.more button{border:0;background:none;color:var(--accent);padding:0}
.lvb{display:inline-block;font-size:11px;font-weight:600;padding:0 7px;border-radius:9px;line-height:17px;color:#fff;white-space:nowrap}
.lv5{background:var(--l5)}.lv4{background:var(--l4)}.lv3{background:var(--l3);color:#222}.lv2{background:var(--l2)}.lv1{background:var(--l1)}.lv0{background:var(--l0);color:var(--text)}.lvu{background:var(--lu)}
.fi.lv5{background:var(--l5)}.fi.lv4{background:var(--l4)}.fi.lv3{background:var(--l3)}.fi.lv2{background:var(--l2)}.fi.lv1,.fi.lv0{background:var(--l0)}.fi.lvu{background:var(--lu)}
.legend{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
/* details */
.det-head{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:flex-start}
.det-head .t{flex:1;min-width:0}
.det-head .t b{display:block;font-size:14px;word-break:break-word}
.det-head .t .p{font-family:var(--mono);font-size:11px;color:var(--muted);word-break:break-all;margin-top:3px}
.x{border:0;background:none;font-size:18px;line-height:1;color:var(--muted);padding:2px 6px;border-radius:6px}
.x:hover{background:var(--hover)}
.sec{padding:10px 14px;border-bottom:1px solid var(--line2)}
.sec h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:650}
.kv{display:grid;grid-template-columns:130px 1fr;gap:3px 10px;font-size:12.5px}
.kv div:nth-child(odd){color:var(--muted)}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th{text-align:left;font-weight:600;color:var(--muted);padding:4px 6px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
table.t td{padding:4px 6px;border-bottom:1px solid var(--line2);vertical-align:top}
table.t tr.hit td{background:var(--sel)}
table.t tr.denyrow td:first-child{color:var(--deny);font-weight:650}
.mono{font-family:var(--mono);font-size:11.5px}
.muted{color:var(--muted)}
.small{font-size:11.5px}
.ulist .lvgrp{margin:8px 0 4px;display:flex;gap:8px;align-items:center}
.ulist .u{display:flex;gap:8px;padding:2px 0;font-size:12.5px}
.ulist .u .n{min-width:0;flex:none;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ulist .u .w{color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* graph */
.graphwrap{padding:16px}
svg.g text{font-size:12px;fill:var(--text)}
svg.g .lnk{fill:none;stroke-width:1.6;opacity:.55}
svg.g .lnk.dim{opacity:.08}
svg.g .lnk.hi{opacity:1;stroke-width:2.4}
svg.g .nb{fill:var(--panel);stroke:var(--line)}
svg.g .node{cursor:pointer}
svg.g .node:hover .nb{stroke:var(--accent)}
svg.g .node.dimn{opacity:.3}
svg.g .node.pinned .nb{stroke:var(--accent);stroke-width:2}
svg.g .fb{fill:transparent}
svg.g .fnode:hover .fb{fill:var(--hover)}
svg.g .fnode.pinned .fb{fill:var(--sel);stroke:var(--accent)}
svg.g .open{fill:var(--accent);font-size:13px;font-weight:700;cursor:pointer}
svg.g .open:hover{fill:var(--text)}
.pininfo{min-height:18px;margin:0 0 6px;color:var(--accent);font-size:12.5px;font-weight:550}
svg.g .colh{font-size:11px;fill:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:650}
svg.g .sm{font-size:10.5px;fill:var(--muted)}
/* matrix */
.mxwrap{padding:0 0 40px 0}
.mx{border-collapse:separate;border-spacing:0;font-size:12px}
.mx th,.mx td{padding:0}
.mx thead th{position:sticky;top:0;background:var(--bg);z-index:3;vertical-align:bottom}
.mx thead th.corner{left:0;z-index:4;text-align:left;vertical-align:bottom;padding:0 10px 6px 12px;color:var(--muted);font-weight:500;font-size:11.5px}
.mx thead th.rh{pointer-events:none;height:var(--mxh,150px);width:26px;min-width:26px;max-width:26px;white-space:nowrap}
.mx thead th.rh>div{transform:translate(13px,-4px) rotate(-50deg);transform-origin:bottom left;width:26px}
.mx thead th.rh>div>span{display:inline-block;max-width:var(--mxlw,200px);overflow:hidden;text-overflow:ellipsis;padding:1px 4px;border-radius:4px;cursor:pointer;font-weight:550;vertical-align:bottom;line-height:16px;pointer-events:auto;background:var(--bg)}
.mx thead th.rh>div>span:hover{background:var(--accent-bg);color:var(--accent)}
.mx thead th.rh.self>div>span{color:var(--accent)}
.mx thead th.rh.hi>div>span{background:var(--accent);color:#fff}
.mx thead th.rh.dis>div>span{text-decoration:line-through;color:var(--muted)}
.mx tbody th{position:sticky;left:0;background:var(--bg);z-index:2;text-align:left;font-weight:500;padding:0 10px 0 12px;white-space:nowrap;max-width:var(--mxrw,340px);overflow:hidden;text-overflow:ellipsis;height:24px}
.mx tbody tr:hover>th,.mx tbody tr.hi>th{color:var(--accent);background:var(--hover)}
.mx tbody tr:hover>td{background:var(--hover)}
.mx td .c{width:22px;height:20px;margin:2px;border-radius:3px;position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:rgba(255,255,255,.92)}
.mx td .c.lv3{color:#4a3a00}
.mx td .c.lv0{background:var(--line2);color:transparent}
.mx td .c.lv1{background:var(--line2);color:var(--faint)}
.mx td .c.lvu{color:#fff}
.mx td .c:hover{outline:2px solid var(--accent);outline-offset:1px}
.mx td .c.deeper::after{content:"";position:absolute;right:2px;top:2px;width:6px;height:6px;border-radius:50%;background:var(--accent);border:1px solid var(--panel)}
.mx td.colhi{background:var(--hover)}
.mx .tree-tg{display:inline-flex;width:16px;justify-content:center;color:var(--faint);cursor:pointer;font-size:10px;margin-right:2px}
.mx .tree-tg:hover{color:var(--text)}
.mx .tree-tg.none{visibility:hidden}
.mx .fname{cursor:pointer}
.mx .fname:hover{text-decoration:underline}
.mx .fcnt{color:var(--faint);font-size:11px;margin-left:6px;font-weight:400}
.mx tr.flash>th{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:var(--accent-bg)}100%{background:var(--bg)}}
.mx tr.more>th button{border:0;background:none;color:var(--accent);padding:0;font-size:12px}
.dept{font-size:11px;color:var(--muted);padding-top:10px!important;text-transform:uppercase;letter-spacing:.04em;height:auto!important}
.crumbs{display:flex;align-items:center;gap:2px;flex-wrap:wrap;font-size:12.5px;padding:6px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.crumbs a{padding:2px 6px;border-radius:5px;color:var(--text)}
.crumbs a:hover{background:var(--hover);text-decoration:none}
.crumbs a.cur{font-weight:650;color:var(--accent)}
.crumbs .sep{color:var(--faint)}
.mxbar{display:flex;flex-direction:column}
.mxbar .seg button{white-space:nowrap;padding:4px 10px}
.mxnote{color:var(--muted);font-size:12px;padding:8px 16px 0}
/* issues */
.issues{max-width:1200px;margin:0 auto;padding:16px 20px 60px}
.issues h2{margin:4px 0 4px;font-size:18px}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:12px 0 18px}
.sumc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.sumc:hover{border-color:var(--accent)}
.sumc b{font-size:20px;display:block}
.sumc span{color:var(--muted);font-size:12px}
.sumc.crit b{color:var(--crit)}.sumc.warn b{color:var(--warn)}.sumc.info b{color:var(--info)}
details.iss{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin:10px 0;overflow:hidden}
details.iss>summary{padding:10px 14px;cursor:pointer;display:flex;gap:10px;align-items:center;list-style:none}
details.iss>summary::-webkit-details-marker{display:none}
details.iss>summary .sev{width:8px;height:8px;border-radius:50%;flex:none}
.sev.crit{background:var(--crit)}.sev.warn{background:var(--warn)}.sev.info{background:var(--info)}
details.iss>summary b{flex:1}
details.iss .body{padding:0 14px 12px}

<body>
<div class="app">

  <main id="main">
    <div id="load">
      <div class="dropzone" id="drop">

        <p>Drop the ZIP from <span class="mono">Collect-FSAudit.ps1</span> here (or all CSV files from it).</p>
        <p class="hint">Data is processed only in this browser and is not sent anywhere.</p>
        <button class="pick" id="pickBtn">Choose file…</button>
        <input type="file" id="file" accept=".zip,.csv,.json" multiple hidden>
        <div id="loadStatus"></div>
      </div>

    <!-- principal tree -->

      <div class="col main">

      </div>
      <div class="col detcol" id="detTree"></div>
    </section>

    <!-- graph -->
    <section class="view v3" id="v-graph">
      <div class="col" id="sideGraph"></div>
      <div class="col main">
        <div id="pheadGraph"></div>
        <div class="toolbar" id="tbGraph"></div>
        <div class="scroll"><div class="graphwrap" id="graph"></div></div>

      <div class="col"></div>

    <!-- folders -->

      <div class="col main">
        <div id="cmpHead"></div>
        <div class="toolbar" id="tbCmp"></div>
        <div class="scroll"><div class="tree" id="treeC"></div></div>
      </div>
      <div class="col detcol" id="detCompare"></div>
    </section>

    <!-- issues -->
    <section class="view" id="v-issues">
      <div class="scroll"><div class="issues" id="issues"></div></div>
    </section>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>/*JSZIP*/</script>
<script>
'use strict';
/* ====================================================================
   Helpers
   ==================================================================== */
const $ = (s, r = document) => r.querySelector(s);
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'html') e.innerHTML = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat(Infinity)) {
    if (k == null || k === false) continue;
    e.append(k instanceof Node ? k : document.createTextNode(String(k)));
  }
  return e;
}
const svgNS = 'http://www.w3.org/2000/svg';
function sv(tag, attrs, ...kids) {
  const e = document.createElementNS(svgNS, tag);
  if (attrs) for (const k in attrs) {
    if (attrs[k] == null) continue;
    if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]); else e.setAttribute(k, attrs[k]);
  }
  for (const k of kids.flat()) if (k != null) e.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return e;
}
const fmtN = n => (n ?? 0).toLocaleString('en-US');
function plural(n, f) { return n === 1 ? f[0] : f[1]; }
const filesTxt = n => `${fmtN(n)} ${plural(n, ['file', 'files'])}`;
const foldersTxt = n => `${fmtN(n)} ${plural(n, ['folder', 'folders'])}`;
function fmtBytes(b) { if (!(b > 0)) return '0 B'; const u = ['B', 'KB', 'MB', 'GB', 'TB']; let i = 0; while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; } return (i ? b.toFixed(1) : b) + ' ' + u[i]; }
function fmtDate(s) { if (!s) return ''; const d = new Date(s); if (isNaN(d)) return s; return d.toLocaleDateString('en-GB') + (s.length > 10 ? ' ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) : ''); }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 1800); }
const tick = () => new Promise(r => setTimeout(r, 0));

function parseCSV(t) {
  if (t.charCodeAt(0) === 0xFEFF) t = t.slice(1);
  const rows = []; let row = []; let i = 0; const n = t.length;
  if (!n) return rows;
  while (i < n) {
    let field, c = t.charCodeAt(i);
    if (c === 34) {
      let j = i + 1, s = '';
      for (;;) {
        const k = t.indexOf('"', j);
        if (k < 0) { s += t.slice(j); i = n; break; }
        s += t.slice(j, k);
        if (t.charCodeAt(k + 1) === 34) { s += '"'; j = k + 2; } else { i = k + 1; break; }
      }
      field = s;
    } else {
      let j = i;
      while (j < n) { const d = t.charCodeAt(j); if (d === 44 || d === 10 || d === 13) break; j++; }
      field = t.slice(i, j); i = j;
    }
    row.push(field);
    c = t.charCodeAt(i);
    if (c === 44) { i++; if (i >= n) row.push(''); continue; }
    if (c === 13) i++;
    if (t.charCodeAt(i) === 10) i++;
    rows.push(row); row = [];
  }
  if (row.length) rows.push(row);
  return rows;
}
function csvObjects(t) {
  const rows = parseCSV(t || '');
  if (!rows.length) return [];
  const h = rows[0];
  const out = [];
  for (let r = 1; r < rows.length; r++) {
    const a = rows[r]; if (a.length === 1 && a[0] === '') continue;
    const o = {}; for (let k = 0; k < h.length; k++) o[h[k]] = a[k] ?? '';
    out.push(o);
  }
  return out;
}
function downloadCSV(name, header, rows) {
  const esc = v => { v = v == null ? '' : String(v); return /[",\n\r;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const txt = '﻿' + [header, ...rows].map(r => r.map(esc).join(',')).join('\r\n');
  const a = el('a', { href: URL.createObjectURL(new Blob([txt], { type: 'text/csv;charset=utf-8' })), download: name });
  document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
const safeName = s => String(s).replace(/[\\/:*?"<>|]+/g, '_').slice(0, 80);

/* ====================================================================
   Rights / levels
   ==================================================================== */
const LV = {
  '-1': { n: 'no data', c: 'lvu', d: 'ACL could not be read during collection' },
  0: { n: 'none', c: 'lv0', d: 'No access' },
  1: { n: 'traverse', c: 'lv1', d: 'Traverse only - cannot open the folder, but can pass through to subfolders' },
  2: { n: 'read', c: 'lv2', d: 'List contents and read' },
  3: { n: 'write', c: 'lv3', d: 'Create/write without delete' },
  4: { n: 'modify', c: 'lv4', d: 'Modify, including delete' },
  5: { n: 'full', c: 'lv5', d: 'Full control, including changing permissions and owner' },
};
const THR_OPTS = [[2, 'read and above'], [3, 'write and above'], [4, 'modify and above'], [5, 'full only']];
const lvBadge = (l, extra) => el('span', { class: 'lvb ' + LV[l].c, title: LV[l].d }, LV[l].n, extra || '');
function mapGeneric(m) {
  let r = m & 0x0FFFFFFF;
  if (m & 0x10000000) r |= 0x1F01FF;
  if (m & 0x80000000) r |= 0x120089;
  if (m & 0x40000000) r |= 0x120116;
  if (m & 0x20000000) r |= 0x1200A0;
  return r >>> 0;
}
function levelOf(g) {
  if ((g & 0x1F01FF) === 0x1F01FF) return 5;
  const r = g & 1, w = g & 6, del = g & 0x10000;
  if (r && w && del) return 4;
  if (w) return 3;
  if (r) return 2;
  if (g & 0x20) return 1;
  return 0;
}
function rightsName(m, raw) {
  const k = { 0x1F01FF: 'Full control', 0x1301BF: 'Modify', 0x1200A9: 'Read & execute', 0x120089: 'Read', 0x100116: 'Write', 0x120116: 'Write', 0x1201BF: 'Read, execute, write', 0x10000: 'Delete', 0x100021: 'List folder', 0x1200A0: 'Execute/traverse' }[m];
  return k || raw || ('0x' + m.toString(16));
}
function applyTo(a) {
  let t;
  if (a.ci && a.oi) t = a.io ? 'subfolders and files only' : 'this folder, subfolders and files';
  else if (a.ci) t = a.io ? 'subfolders only' : 'this folder and subfolders';
  else if (a.oi) t = a.io ? 'files only' : 'this folder and files';
  else t = 'this folder only';
  if (a.np) t += ' (1 level)';
  return t;
}

const WK = { EVERYONE: 'S-1-1-0', AUTH: 'S-1-5-11', NETWORK: 'S-1-5-2', SYSTEM: 'S-1-5-18', CREATOR: 'S-1-3-0', OWNERRIGHTS: 'S-1-3-4', BADMINS: 'S-1-5-32-544', BUSERS: 'S-1-5-32-545' };
const WK_NAMES = { 'S-1-1-0': 'Everyone', 'S-1-5-11': 'NT AUTHORITY\\Authenticated Users', 'S-1-5-2': 'NT AUTHORITY\\NETWORK', 'S-1-5-4': 'NT AUTHORITY\\INTERACTIVE', 'S-1-5-18': 'NT AUTHORITY\\SYSTEM', 'S-1-3-0': 'CREATOR OWNER', 'S-1-3-4': 'OWNER RIGHTS', 'S-1-5-32-544': 'BUILTIN\\Administrators', 'S-1-5-32-545': 'BUILTIN\\Users' };

/* ====================================================================
   Data model
   ==================================================================== */
let D = null;

async function loadFiles(fileList) {
  const status = $('#loadStatus');
  const log = s => { status.textContent += s + '\n'; };
  status.textContent = '';
  const files = {};
  const t0 = performance.now();
  try {
    for (const f of fileList) {
      if (/\.zip$/i.test(f.name)) {
        log('Unpacking ' + f.name + '…'); await tick();
        const zip = await JSZip.loadAsync(f);
        for (const name of Object.keys(zip.files)) {
          const z = zip.files[name]; if (z.dir) continue;
          const base = name.split('/').pop().toLowerCase();
          if (/\.(csv|json|log)$/.test(base)) files[base] = await z.async('string');
        }
      } else {
        files[f.name.toLowerCase()] = await f.text();
      }
    }
    if (!files['folders.csv'] || !files['acl_entries.csv']) throw new Error('folders.csv / acl_entries.csv not found');
    log('Parsing CSV…'); await tick();
    D = buildData(files, log);
    log(`Done in ${((performance.now() - t0) / 1000).toFixed(1)} s`); await tick();
    startApp();
  } catch (e) {
    console.error(e);
    log('ERROR: ' + (e && e.message || e));
  }
}

function buildData(files, log) {
  const d = {};
  d.meta = {}; try { if (files['meta.json']) d.meta = JSON.parse(files['meta.json'].replace(/^﻿/, '')); } catch (e) {}

  /* ---- folders ---- */
  const rows = parseCSV(files['folders.csv']);
  const h = rows[0]; const ix = {}; h.forEach((k, i) => ix[k] = i);
  const need = ['Id', 'ParentId', 'Depth', 'Name', 'OwnerSid', 'InheritanceDisabled', 'AclId', 'ExplicitAceCount', 'FileCount', 'FileBytes', 'LastWriteUtc', 'Error'];
  for (const k of need) if (!(k in ix)) throw new Error('folders.csv: missing column ' + k);
  let maxId = 0;
  for (let r = 1; r < rows.length; r++) { const v = +rows[r][ix.Id]; if (v > maxId) maxId = v; }
  const N = maxId;
  d.N = N;
  d.parent = new Int32Array(N + 1); d.depth = new Uint8Array(N + 1); d.acl = new Int16Array(N + 1);
  d.files = new Int32Array(N + 1).fill(-1); d.bytes = new Float64Array(N + 1); d.owner = new Int32Array(N + 1).fill(-1);
  d.inhOff = new Uint8Array(N + 1); d.explicit = new Int16Array(N + 1); d.exists = new Uint8Array(N + 1);
  d.name = new Array(N + 1); d.lw = new Array(N + 1); d.err = new Map(); d.ownerSids = []; const ownerIx = new Map();
  for (let r = 1; r < rows.length; r++) {
    const a = rows[r]; if (a.length < h.length) continue;
    const id = +a[ix.Id];
    d.exists[id] = 1;
    d.parent[id] = +a[ix.ParentId]; d.depth[id] = +a[ix.Depth]; d.name[id] = a[ix.Name];
    d.acl[id] = a[ix.AclId] ? +a[ix.AclId] : 0;
    if (a[ix.FileCount] !== '') d.files[id] = +a[ix.FileCount];
    d.bytes[id] = +a[ix.FileBytes] || 0;
    const o = a[ix.OwnerSid];
    if (o) { let k = ownerIx.get(o); if (k === undefined) { k = d.ownerSids.length; d.ownerSids.push(o); ownerIx.set(o, k); } d.owner[id] = k; }
    d.inhOff[id] = a[ix.InheritanceDisabled] === 'True' ? 1 : 0;
    d.explicit[id] = +a[ix.ExplicitAceCount] || 0;
    d.lw[id] = a[ix.LastWriteUtc];
    if (a[ix.Error]) d.err.set(id, a[ix.Error]);
  }
  rows.length = 0;
  d.root = 0; for (let i = 1; i <= N; i++) if (d.exists[i] && d.parent[i] === 0) { d.root = i; break; }
  log(`Folders: ${fmtN(N)}`);

  /* ---- children (CSR, sorted by name) ---- */
  const cnt = new Int32Array(N + 2);
  for (let i = 1; i <= N; i++) if (d.exists[i] && d.parent[i]) cnt[d.parent[i]]++;
  d.kStart = new Int32Array(N + 2);
  for (let i = 1; i <= N + 1; i++) d.kStart[i] = d.kStart[i - 1] + cnt[i - 1];
  // kStart[i] = start index of kids of i
  const pos = d.kStart.slice(); d.kids = new Int32Array(d.kStart[N + 1]);
  for (let i = 1; i <= N; i++) if (d.exists[i] && d.parent[i]) d.kids[pos[d.parent[i]]++] = i;
  const coll = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });
  for (let i = 1; i <= N; i++) {
    const s = d.kStart[i], e = d.kStart[i + 1];
    if (e - s > 1) { const seg = Array.from(d.kids.subarray(s, e)); seg.sort((x, y) => coll.compare(d.name[x], d.name[y])); d.kids.set(seg, s); }
  }
  // order by depth asc (for bottom-up passes)
  const byDepth = []; for (let i = 1; i <= N; i++) if (d.exists[i]) (byDepth[d.depth[i]] ||= []).push(i);
  d.order = Int32Array.from(byDepth.flat());
  d.subSize = new Int32Array(N + 1);
  for (let k = d.order.length - 1; k >= 0; k--) { const i = d.order[k]; d.subSize[i] += 1; const p = d.parent[i]; if (p) d.subSize[p] += d.subSize[i]; }

  /* ---- ACLs ---- */
  const aclRows = csvObjects(files['acl_entries.csv']);
  d.ACL = []; d.aclIds = [];
  for (const r of aclRows) {
    const id = +r.AclId; if (!d.ACL[id]) { d.ACL[id] = []; d.aclIds.push(id); }
    const fl = r.InheritanceFlags || '', pf = r.PropagationFlags || '';
    const raw = +r.RightsMask;
    d.ACL[id].push({ ord: +r.Order, sid: r.Sid, allow: r.AccessType === 'Allow', raw, m: mapGeneric(raw), rights: r.Rights, inh: r.IsInherited === 'True', ci: fl.includes('ContainerInherit'), oi: fl.includes('ObjectInherit'), io: pf.includes('InheritOnly'), np: pf.includes('NoPropagateInherit') });
  }
  for (const id of d.aclIds) d.ACL[id].sort((a, b) => a.ord - b.ord);
  for (const r of csvObjects(files['acl_special.csv'])) { const id = +r.AclId; if (!d.ACL[id]) { d.ACL[id] = []; d.aclIds.push(id); } d.ACL[id].special = r.Kind; }
  d.aclFolders = new Int32Array(Math.max(0, ...d.aclIds) + 1);
  for (let i = 1; i <= N; i++) if (d.acl[i]) d.aclFolders[d.acl[i]]++;
  log(`Unique ACLs: ${d.aclIds.length}`);

  /* ---- principals ---- */
  const P = new Map(); d.P = P;
  const sidNames = new Map(); for (const r of csvObjects(files['sids.csv'])) if (r.Name) sidNames.set(r.Sid, r.Name);
  const domSid = (d.meta.Counts && d.meta.Counts.DomainSid) || '';
  d.domSid = domSid;
  let nb = '';
  for (const [s, n] of sidNames) if (domSid && s.startsWith(domSid + '-') && n.includes('\\')) { nb = n.split('\\')[0]; break; }
  if (!nb && d.meta.Counts && d.meta.Counts.Domain) nb = d.meta.Counts.Domain.split('.')[0].toUpperCase();
  d.nb = nb;
  const users = csvObjects(files['ad_users.csv']), groups = csvObjects(files['ad_groups.csv']), comps = csvObjects(files['ad_computers.csv']);
  for (const u of users) P.set(u.Sid, { sid: u.Sid, type: 'user', sam: u.SamAccountName, name: u.DisplayName || u.SamAccountName, full: (nb ? nb + '\\' : '') + u.SamAccountName, enabled: u.Enabled !== 'False', lastLogon: u.LastLogonDate, dept: u.Department, title: u.Title, desc: u.Description, created: u.WhenCreated, pwdNever: u.PasswordNeverExpires === 'True', dn: u.DistinguishedName });
  for (const g of groups) {
    const builtin = g.Sid.startsWith('S-1-5-32-');
    P.set(g.Sid, { sid: g.Sid, type: 'group', sam: g.SamAccountName, name: (builtin ? 'BUILTIN\\' : '') + g.SamAccountName, full: sidNames.get(g.Sid) || ((builtin ? 'BUILTIN' : nb) + '\\' + g.SamAccountName), enabled: true, scope: g.GroupScope, cat: g.GroupCategory, desc: g.Description, managedBy: g.ManagedBy, dn: g.DistinguishedName });
  }
  for (const c of comps) P.set(c.Sid, { sid: c.Sid, type: 'computer', sam: c.SamAccountName, name: c.SamAccountName, full: (nb ? nb + '\\' : '') + c.SamAccountName, enabled: c.Enabled !== 'False', lastLogon: c.LastLogonDate, dn: c.DistinguishedName });
  const ensure = sid => {
    if (!sid || P.has(sid)) return;
    const n = sidNames.get(sid) || WK_NAMES[sid];
    if (n) P.set(sid, { sid, type: 'wk', name: n, full: n, enabled: true });
    else P.set(sid, { sid, type: 'orphan', name: 'Unknown SID …' + sid.split('-').pop(), full: sid, enabled: false });
  };
  for (const id of d.aclIds) for (const a of d.ACL[id]) ensure(a.sid);
  for (const s of d.ownerSids) ensure(s);
  for (const s of [WK.EVERYONE, WK.AUTH, WK.NETWORK]) ensure(s);
  P.set('__ANY__', { sid: '__ANY__', type: 'wk', name: 'Any domain user', full: 'Any domain user (Everyone + Authenticated Users + Domain Users + Users)', enabled: true });
  d.users = users.map(u => u.Sid);

  /* ---- memberships ---- */
  d.parentsOf = new Map(); d.membersOf = new Map();
  for (const m of csvObjects(files['ad_members.csv'])) {
    if (!m.MemberSid || !m.GroupSid) continue;
    ensure(m.MemberSid); ensure(m.GroupSid);
    (d.parentsOf.get(m.MemberSid) || d.parentsOf.set(m.MemberSid, []).get(m.MemberSid)).push(m.GroupSid);
    (d.membersOf.get(m.GroupSid) || d.membersOf.set(m.GroupSid, []).get(m.GroupSid)).push(m.MemberSid);
  }
  for (const m of csvObjects(files['local_members.csv'])) {
    if (!m.MemberSid || !m.GroupSid) continue;
    ensure(m.MemberSid); ensure(m.GroupSid);
    (d.parentsOf.get(m.MemberSid) || d.parentsOf.set(m.MemberSid, []).get(m.MemberSid)).push(m.GroupSid);
    (d.membersOf.get(m.GroupSid) || d.membersOf.set(m.GroupSid, []).get(m.GroupSid)).push(m.MemberSid);
  }
  for (const r of csvObjects(files['local_groups.csv'])) if (P.get(r.Sid)?.type === 'wk') P.get(r.Sid).type = 'group';

  /* ---- shares ---- */
  d.shares = csvObjects(files['shares.csv']);
  d.shareAccess = csvObjects(files['share_access.csv']);
  d.errorsRows = csvObjects(files['errors.csv']);
  const rootPath = (d.name[d.root] || '').toLowerCase().replace(/\\+$/, '');
  d.share = null;
  for (const s of d.shares) {
    if (s.Special === 'True' || !s.Path) continue;
    const p = s.Path.toLowerCase().replace(/\\+$/, '');
    if (rootPath === p || rootPath.startsWith(p + '\\')) { if (!d.share || p.length > d.share.Path.length) d.share = s; }
  }
  d.shareAces = d.share ? d.shareAccess.filter(a => a.ShareName === d.share.Name) : [];

  /* ---- explicit ACE points per SID ---- */
  d.explicitBySid = new Map();
  for (let i = 1; i <= N; i++) {
    const a = d.acl[i]; if (!a || !d.explicit[i]) continue;
    for (const ace of d.ACL[a]) if (!ace.inh) {
      let arr = d.explicitBySid.get(ace.sid); if (!arr) d.explicitBySid.set(ace.sid, arr = []);
      arr.push({ f: i, ace });
    }
  }

  tb.append(el('label', null, 'Show:', el('select', { onchange: e => { S.thr = +e.target.value; renderGraphView(); } }, THR_OPTS.map(([v, n]) => el('option', { value: v, selected: S.thr === v }, n)))),

  svg.append(sv('text', { x: colX[0], y: 14, class: 'colh' }, 'Principal'), sv('text', { x: colX[1], y: 14, class: 'colh' }, 'Via'), sv('text', { x: colX[2], y: 14, class: 'colh' }, `Entry points (${shown.length}${entries.length > MAXF ? ' of ' + entries.length : ''})`));
  const midY = new Map(); mids.forEach((s, k) => midY.set(s, top + k * RH + RH / 2));

  const curve = (x1, y1, x2, y2) => { const mx = (x1 + x2) / 2; return `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`; };

      p._mid = s; p._f = e.i; links.append(p); linkEls.push(p);

  // highlight state: sel = {mids:Set, fs:Set}; empty -> everything normal

function mxData(mode) {

    const lvA = new Int8Array(D.aclFolders.length).fill(-1);

    el('button', { class: 'btn small primary', onclick: () => exportCompareXlsx() }, '⤓ Excel report'),
    el('div', { class: 'spacer' }),
    el('div', { class: 'legend' }, el('span', { class: 'fi-dot k1' }), 'only A', el('span', { class: 'fi-dot k2' }), 'only B', el('span', { class: 'fi-dot k3' }), 'different level', el('span', { class: 'fi-dot k4' }), 'same'));
  const t = new Tree(tree, {
    visible: i => (x.mask[i] & fm) !== 0,
    emptyText: 'No folders for this filter.',
    iconClass: i => x.kind[i] ? CK[x.kind[i]].c : 'lv0',
    decorate(row, i) {
      const k = x.kind[i];
      if (!((1 << k) & fm)) row.classList.add('pass');
      const la = x.A.lv[i], lb = x.B.lv[i];
      row.append(el('span', { class: 'abtag a' }, 'A'), cmpLv(la), el('span', { class: 'abtag b' }, 'B'), cmpLv(lb));
      const p = D.parent[i];
      if (k && k < 4 && (!p || x.kind[p] !== k)) {
        const ra = D.acl[i] ? x.A.res[D.acl[i]] : null, rb = D.acl[i] ? x.B.res[D.acl[i]] : null;
        const va = la >= 2 ? viaText(x.A, ra) : '', vb = lb >= 2 ? viaText(x.B, rb) : '';
        row.append(el('span', { class: 'via' }, [va ? 'A via ' + va : '', vb ? 'B via ' + vb : ''].filter(Boolean).join(' · ')));
      }
      if (D.inhOff[i]) row.append(el('span', { class: 'tag inh', title: 'Inheritance disabled' }, 'inherit. off'));
    },
    onSelect: i => showDetails('compare', i, x.A, x.B),
  });
  D.ui.treeC = t;
}

async function exportCompareXlsx() {
  toast('Building Excel…'); await new Promise(r => setTimeout(r, 30));
  const x = cmpData(); const A = x.A, B = x.B; const pa = D.P.get(CMP.a), pb = D.P.get(CMP.b);
  const fullPath = new Array(D.N + 1);
  for (const i of D.order) fullPath[i] = D.parent[i] ? fullPath[D.parent[i]] + '\\' + D.name[i] : D.name[i];
  const coll = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });
  const lvc = l => { const v = l >= 2 || l === -1 ? l : 0; return { v: LV_EN[v], s: XS_LV[v] }; };
  const via = (c, i) => { const r = D.acl[i] ? c.res[D.acl[i]] : null; return r && c.lv[i] >= 2 ? [...new Set(r.gs.map(g => g.sid))].map(s => chainText(c.tok, s, c.sid)).join('; ') : ''; };
  const diff = [], entries = [];
  for (let i = 1; i <= D.N; i++) { const k = x.kind[i]; if (!k || k === 4) continue; diff.push(i); if (!D.parent[i] || x.kind[D.parent[i]] !== k) entries.push(i); }
  const by = (p, q) => coll.compare(fullPath[p], fullPath[q]);
  diff.sort(by); entries.sort(by);
  const kindCell = k => ({ v: CK[k].n, s: k === 1 ? XS.bold : k === 2 ? XS.bold : XS.cell });
  const S1 = { name: 'Summary', widths: [34, 44, 44], rows: [], merges: ['A1:C1', 'A2:C2'], heights: { 0: 26 } };
  const R = S1.rows;
  R.push([{ v: `Access comparison - ${pa.name} vs ${pb.name}`, s: XS.title }]);
  R.push([{ v: `${D.name[D.root]} · snapshot ${fmtDate(D.meta.EndUtc)}${D.meta.Computer ? ' · ' + D.meta.Computer : ''}`, s: XS.muted }]);
  R.push([]);
  R.push([{ v: '', s: XS.header }, { v: 'A', s: XS.header }, { v: 'B', s: XS.header }]);
  const pinfo = p => p.type === 'user' ? (p.enabled ? 'User' : 'User (disabled)') + (p.dept ? ' · ' + p.dept : '') : p.type === 'group' ? 'Group' + (p.scope ? ' (' + p.scope + ')' : '') : p.type;
  R.push([{ v: 'Name', s: XS.label }, { v: pa.name, s: XS.bold }, { v: pb.name, s: XS.bold }]);
  R.push([{ v: 'Account', s: XS.label }, { v: pa.full, s: XS.cell }, { v: pb.full, s: XS.cell }]);
  R.push([{ v: 'Type', s: XS.label }, { v: pinfo(pa), s: XS.cell }, { v: pinfo(pb), s: XS.cell }]);
  const accA = x.cnt[1] + x.cnt[3] + x.cnt[4], accB = x.cnt[2] + x.cnt[3] + x.cnt[4];
  R.push([{ v: 'Folders with access', s: XS.label }, { v: accA, s: XS.num }, { v: accB, s: XS.num }]);
  R.push([]);
  R.push([{ v: 'Differences', s: XS.sub }]);
  R.push([{ v: 'Only A has access', s: XS.label }, { v: x.cnt[1], s: XS.num }, { v: `${x.ent[1]} entry points`, s: XS.cell }]);
  R.push([{ v: 'Only B has access', s: XS.label }, { v: x.cnt[2], s: XS.num }, { v: `${x.ent[2]} entry points`, s: XS.cell }]);
  R.push([{ v: 'Both, different level', s: XS.label }, { v: x.cnt[3], s: XS.num }, { v: `${x.ent[3]} entry points`, s: XS.cell }]);
  R.push([{ v: 'Both, same level', s: XS.label }, { v: x.cnt[4], s: XS.num }, { v: '', s: XS.cell }]);
  R.push([]);
  R.push([{ v: 'Group membership', s: XS.sub }]);
  R.push([{ v: 'Only A', s: XS.header }, { v: 'Only B', s: XS.header }, { v: 'Common', s: XS.header }]);
  const gA = x.groups.onlyA.map(pName).sort(), gB = x.groups.onlyB.map(pName).sort(), gC = x.groups.common.map(pName).sort();
  for (let k = 0; k < Math.max(gA.length, gB.length, gC.length, 1); k++) R.push([{ v: gA[k] || '', s: XS.cell }, { v: gB[k] || '', s: XS.cell }, { v: gC[k] || '', s: XS.cell }]);
  R.push([]);
  R.push([{ v: '"Entry points" lists the top folders where a difference starts; "All differences" lists every folder that differs. Folder level only; Deny before Allow; nested groups and share permissions included.', s: XS.muted }]);
  S1.merges.push(`A${R.length}:C${R.length}`); S1.heights[R.length - 1] = 32;
  const hdr = ['Folder', 'Difference', 'A level', 'B level', 'A via', 'B via', 'Subfolders'];
  const rowOf = i => [{ v: fullPath[i], s: XS.cell }, kindCell(x.kind[i]), lvc(A.lv[i]), lvc(B.lv[i]), { v: via(A, i), s: XS.cell }, { v: via(B, i), s: XS.cell }, { v: D.subSize[i] - 1, s: XS.num }];
  const t1 = tableBlock(1, hdr, entries.map(rowOf)), t2 = tableBlock(1, hdr, diff.map(rowOf));
  const W = [80, 16, 10, 10, 36, 36, 11];
  const blob = await buildXlsx([S1, { name: 'Entry points', widths: W, rows: t1.rows, freeze: 1, filter: t1.filter }, { name: 'All differences', widths: W, rows: t2.rows, freeze: 1, filter: t2.filter }]);
  const nm = p => safeName(p.type === 'user' ? p.sam : pShort(p.sid)).replace(/\s+/g, '_');
  saveBlob(blob, `Compare_${nm(pa)}_vs_${nm(pb)}_${(D.meta.EndUtc || '').slice(0, 10)}.xlsx`);
  toast('Excel saved');
}

/* ====================================================================
   View: issues
   ==================================================================== */
function renderIssuesView() {
  const host = $('#issues');
  if (D.ui.issuesDone) return;
  host.innerHTML = '<div class="empty">Analysing…</div>';
  setTimeout(() => { const t0 = performance.now(); const list = computeIssues(); drawIssues(host, list); D.ui.issuesDone = true; console.log('issues ms', performance.now() - t0); }, 20);
}
function adminSet() {
  const s = new Set([WK.SYSTEM, WK.BADMINS, WK.CREATOR, D.domSid + '-500', D.domSid + '-512', D.domSid + '-519', D.domSid + '-518']);
  const q = [WK.BADMINS, D.domSid + '-512', D.domSid + '-519'];
  for (let k = 0; k < q.length; k++) for (const m of D.membersOf.get(q[k]) || []) if (!s.has(m)) { s.add(m); q.push(m); }
  return s;
}
function computeIssues() {
  const I = [];
  const fLink = i => el('a', { onclick: () => goFolder(i), title: pathOf(i) }, relPath(i));
  const pLink = s => el('a', { onclick: () => pick(s) }, pName(s));
  const add = (o) => I.push(o);
  const snap = D.meta.EndUtc ? new Date(D.meta.EndUtc) : new Date();
  const base = compute('__ANY__');
  const ust = new Map(); for (const s of D.users) ust.set(s, userStats(s, base));
  const userMax = new Map([...ust].map(([k, v]) => [k, v.max]));
  const admins = adminSet();

  // 0. environment
  const env = [];
  if (D.meta.IsDomainController) env.push(['The file server is a domain controller', `${D.meta.Computer}: data shares on a DC widen the attack surface; BUILTIN\\ groups here are domain groups and apply on all DCs.`]);
  if (D.share) {
    if (D.share.FolderEnumerationMode !== 'AccessBased') env.push(['Access-Based Enumeration is off', `Share "${D.share.Name}": users see the names of all folders, even without access to them.`]);
    const ev = D.shareAces.find(a => a.Sid === WK.EVERYONE && a.AccessControlType === 'Allow' && a.AccessRight === 'Full');
    if (ev) env.push(['Share permissions: Everyone - Full', `Share "${D.share.Name}": access control relies entirely on NTFS permissions. This is common practice, but confirm it is intended.`]);
  }
  add({ id: 'env', sev: 'info', title: 'Environment', count: env.length, desc: 'General observations about the server and the share.', cols: ['Observation', 'Details'], rows: env.map(e => [e[0], e[1]]), csv: env });

  // 1. orphan SIDs
  const orph = [...D.P.values()].filter(p => p.type === 'orphan' && D.aclSids.has(p.sid));
  const orRows = orph.map(p => {
    const ex = D.explicitBySid.get(p.sid) || [];
    let total = 0; for (const id of D.aclIds) if (D.ACL[id].some(a => a.sid === p.sid)) total += D.aclFolders[id];
    const kinds = [...new Set(ex.map(x => (x.ace.allow ? 'Allow ' : 'Deny ') + rightsName(x.ace.m, x.ace.rights)))].join('; ');
    return { p, ex, total, kinds };
  }).sort((a, b) => b.total - a.total);
  add({ id: 'orphan', sev: 'warn', title: 'Permissions for deleted accounts (unresolvable SIDs)', count: orRows.length,
    desc: 'ACL entries for SIDs that no longer exist in AD. They can be removed - especially Deny entries on the root.',
    cols: ['SID', 'Entries', 'Explicit on folders', 'Folders affected', 'Example'],
    rows: orRows.map(r => [el('span', { class: 'mono' }, r.p.sid), r.kinds, r.ex.length, fmtN(r.total), r.ex[0] ? fLink(r.ex[0].f) : '']),
    csv: orRows.map(r => [r.p.sid, r.kinds, r.ex.length, r.total, r.ex.map(x => pathOf(x.f)).join(' | ')]) });

  // 2. disabled users with access
  const dis = D.users.map(s => D.P.get(s)).filter(p => !p.enabled && ust.get(p.sid).extra > 0).sort((a, b) => ust.get(b.sid).extra - ust.get(a.sid).extra);
  add({ id: 'disabled', sev: 'warn', title: 'Disabled accounts with access beyond baseline', count: dis.length,
    desc: 'The account is disabled, but via groups or explicit entries it still has more access than any domain user. A risk if re-enabled; better remove it from groups.',
    cols: ['User', 'Max level', 'Folders beyond baseline', 'Via', 'Last logon'],
    rows: dis.map(p => [pLink(p.sid), lvBadge(userMax.get(p.sid)), fmtN(ust.get(p.sid).extra), ust.get(p.sid).via.join(', '), fmtDate(p.lastLogon) || 'never']),
    csv: dis.map(p => [p.full, LV[userMax.get(p.sid)].n, ust.get(p.sid).extra, ust.get(p.sid).via.join('; '), p.lastLogon]) });

  // 3. stale enabled users
  const stale = D.users.map(s => D.P.get(s)).filter(p => p.enabled && ust.get(p.sid).extra > 0 && (!p.lastLogon || (snap - new Date(p.lastLogon)) / 864e5 > 90));
  add({ id: 'stale', sev: 'warn', title: 'Enabled accounts with no logon > 90 days but with access', count: stale.length,
    desc: 'Enabled but unused accounts with access beyond baseline. Candidates for disabling.',
    cols: ['User', 'Last logon', 'Max level', 'Folders beyond baseline', 'Via', 'Description'],
    rows: stale.map(p => [pLink(p.sid), fmtDate(p.lastLogon) || 'never', lvBadge(userMax.get(p.sid)), fmtN(ust.get(p.sid).extra), ust.get(p.sid).via.join(', '), p.desc || p.title || '']),
    csv: stale.map(p => [p.full, p.lastLogon, LV[userMax.get(p.sid)].n, ust.get(p.sid).extra, p.desc]) });

  // 4. direct user ACEs
  const du = [];
  for (const [sid, ex] of D.explicitBySid) { const p = D.P.get(sid); if (p && p.type === 'user') du.push({ p, ex }); }
  du.sort((a, b) => b.ex.length - a.ex.length);
  add({ id: 'directuser', sev: 'warn', title: 'Permissions granted directly to users instead of groups', count: du.length,
    desc: 'Explicit ACL entries for individual users. Hard to maintain and revoke - use groups instead.',
    cols: ['User', 'Explicit entries', 'Rights', 'Example'],
    rows: du.map(r => [pLink(r.p.sid), r.ex.length, [...new Set(r.ex.map(x => (x.ace.allow ? '' : 'Deny ') + rightsName(x.ace.m, x.ace.rights)))].slice(0, 3).join('; '), fLink(r.ex[0].f)]),
    csv: du.flatMap(r => r.ex.map(x => [r.p.full, x.ace.allow ? 'Allow' : 'Deny', rightsName(x.ace.m, x.ace.rights), pathOf(x.f)])), csvHead: ['User', 'Type', 'Rights', 'Folder'] });

  // 5. baseline: what any domain user gets
  const bEnt = []; const bc = [0, 0, 0, 0, 0, 0];
  for (let i = 1; i <= D.N; i++) { const l = base.lv[i]; if (l >= 2) { bc[l]++; if (isEntry(base, i, 2)) bEnt.push(i); } }
  bEnt.sort((a, b) => base.lv[b] - base.lv[a] || pathOf(a).localeCompare(pathOf(b)));
  const bVia = i => { const r = base.res[D.acl[i]]; if (!r) return ''; const m = new Map(); for (const x of r.gs) m.set(x.sid, (m.get(x.sid) || x.inh) && x.inh); return [...m].map(([sd, inh]) => pShort(sd) + (inh ? (i === D.root ? ' (inherited from drive)' : ' (inherited)') : ' (explicit)')).join(', '); };
  add({ id: 'broad', sev: bc[4] + bc[5] ? 'crit' : 'warn', title: 'Access for any domain user (Everyone / Authenticated Users / Domain Users / Users)', count: bEnt.length,
    desc: `Without any group membership every domain user has: full - ${fmtN(bc[5])}, modify - ${fmtN(bc[4])}, write - ${fmtN(bc[3])}, read - ${fmtN(bc[2])} folders. Below are the points where this access appears. Check that these folders are really meant to be shared. Full tree: principal "Any domain user" (Principal access tab, Other).`,
    cols: ['Folder', 'Level', 'Via', 'Subfolders'],
    rows: bEnt.map(i => [fLink(i), lvBadge(base.lv[i]), bVia(i), fmtN(D.subSize[i] - 1)]),
    csv: bEnt.map(i => [pathOf(i), LV[base.lv[i]].n, bVia(i), D.subSize[i] - 1]) });

  // 6. non-admin full control
  const fc = [];
  for (const [sid, ex] of D.explicitBySid) {
    if (admins.has(sid)) continue;
    const hits = ex.filter(x => x.ace.allow && !x.ace.io && (x.ace.m & 0xC0000));
    if (hits.length) fc.push({ sid, hits });
  }
  fc.sort((a, b) => b.hits.length - a.hits.length);
  add({ id: 'fullctl', sev: 'crit', title: 'Full control (can change permissions) for non-admins', count: fc.length,
    desc: 'Explicit entries allowing permission/owner changes for principals outside Administrators/Domain Admins. They can grant access to anyone themselves.',
    cols: ['Who', 'Type', 'Folders', 'Example'],
    rows: fc.map(r => [pLink(r.sid), D.P.get(r.sid)?.type || '', r.hits.length, fLink(r.hits[0].f)]),
    csv: fc.flatMap(r => r.hits.map(x => [pName(r.sid), rightsName(x.ace.m, x.ace.rights), pathOf(x.f)])), csvHead: ['Who', 'Rights', 'Folder'] });

  // 6b. creator owner -> inherited full control for users
  const coBy = new Map();
  for (const id of D.aclIds) for (const a of D.ACL[id]) {
    if (!a.inh || a.io || !a.allow || !(a.m & 0xC0000)) continue;
    const p = D.P.get(a.sid); if (!p || p.type !== 'user' || admins.has(a.sid)) continue;
    coBy.set(a.sid, (coBy.get(a.sid) || 0) + D.aclFolders[id]);
  }
  const coRows = [...coBy].sort((a, b) => b[1] - a[1]);
  const hasCO = D.ACL[D.acl[D.root]]?.some(a => a.sid === WK.CREATOR && a.allow && (a.m & 0xC0000));
  add({ id: 'creator', sev: 'warn', title: 'Folder creators with full control (CREATOR OWNER)', count: coRows.length,
    desc: (hasCO ? 'The root has a "CREATOR OWNER: Full control" entry. ' : '') + 'So whoever creates a folder gets full control over it and everything inside, including changing permissions. These entries are inherited and do not show up as direct permissions. Usually better replaced with Modify or removed.',
    cols: ['User', 'Folders with full control', 'Account'],
    rows: coRows.map(([sd, n]) => { const p = D.P.get(sd); return [pLink(sd), fmtN(n), p.enabled ? 'active' : el('span', { class: 'tag off' }, 'disabled')]; }),
    csv: coRows.map(([sd, n]) => [pName(sd), n, D.P.get(sd).enabled ? 'active' : 'disabled']) });

  // 7. deny entries
  const dn = [];
  for (const [sid, ex] of D.explicitBySid) for (const x of ex) if (!x.ace.allow) dn.push({ sid, x });
  const dnBy = new Map(); for (const r of dn) { const k = r.sid + '|' + r.x.ace.m; (dnBy.get(k) || dnBy.set(k, []).get(k)).push(r); }
  const dnRows = [...dnBy.values()].sort((a, b) => b.length - a.length);
  add({ id: 'deny', sev: 'info', title: 'Explicit Deny entries', count: dn.length,
    desc: 'Deny makes permissions harder to reason about. A common pattern is "Domain Users: Deny Delete" as protection against deletion.',
    cols: ['Who', 'Denied', 'Folders', 'Example'],
    rows: dnRows.map(g => [pLink(g[0].sid), rightsName(g[0].x.ace.m, g[0].x.ace.rights), g.length, fLink(g[0].x.f)]),
    csv: dn.map(r => [pName(r.sid), rightsName(r.x.ace.m, r.x.ace.rights), applyTo(r.x.ace), pathOf(r.x.f)]), csvHead: ['Who', 'Denied', 'Applies to', 'Folder'] });

  // 8. inheritance disabled
  const inh = []; for (let i = 1; i <= D.N; i++) if (D.inhOff[i] && i !== D.root) inh.push(i);
  const topInh = inh.filter(i => !ancestors(i).some(a => a !== D.root && D.inhOff[a]));
  add({ id: 'inh', sev: 'info', title: 'Folders with inheritance disabled', count: inh.length,
    desc: `${fmtN(inh.length)} in total, ${fmtN(topInh.length)} of them top-level (no such folder above). The table lists top-level ones; the full list is in the CSV.`,
    cols: ['Folder', 'Depth', 'Subfolders', 'Explicit entries'],
    rows: topInh.sort((a, b) => pathOf(a).localeCompare(pathOf(b))).map(i => [fLink(i), D.depth[i], fmtN(D.subSize[i] - 1), D.explicit[i]]),
    csv: inh.map(i => [pathOf(i), D.depth[i], D.subSize[i] - 1, D.explicit[i]]), csvHead: ['Folder', 'Depth', 'Subfolders', 'Explicit entries'] });

  // 9. redundant explicit ACEs
  const redAcl = new Map();
  for (const id of D.aclIds) {
    const aces = D.ACL[id]; const inhA = aces.filter(a => a.inh);
    for (const e of aces) if (!e.inh && inhA.some(x => x.sid === e.sid && x.allow === e.allow && (x.m & e.m) === e.m && x.ci === e.ci && x.oi === e.oi && !x.io)) {
      (redAcl.get(id) || redAcl.set(id, []).get(id)).push(e);
    }
  }
  const redBy = new Map();
  for (const [id, es] of redAcl) for (const e of es) { const k = e.sid; const o = redBy.get(k) || redBy.set(k, { n: 0, ex: 0 }).get(k); o.n += D.aclFolders[id]; }
  const redFolders = []; for (let i = 1; i <= D.N; i++) if (redAcl.has(D.acl[i])) redFolders.push(i);
  const redRows = [...redBy.entries()].sort((a, b) => b[1].n - a[1].n);
  add({ id: 'redundant', sev: 'info', title: 'Redundant explicit entries (duplicate inherited ones)', count: redFolders.length,
    desc: 'The explicit entry grants what is already inherited. Harmless, but clutters ACLs and complicates audits - candidates for cleanup.',
    cols: ['Who', 'Folders with duplicate'],
    rows: redRows.map(([s, o]) => [pLink(s), fmtN(o.n)]),
    csv: redFolders.map(i => [pathOf(i), redAcl.get(D.acl[i]).map(e => pName(e.sid)).join('; ')]), csvHead: ['Folder', 'Duplicate entries'] });

  // 10. owners
  const ownCnt = new Map(); for (let i = 1; i <= D.N; i++) { const o = D.owner[i]; if (o >= 0) ownCnt.set(o, (ownCnt.get(o) || 0) + 1); }
  const ownRows = [...ownCnt.entries()].map(([k, n]) => ({ sid: D.ownerSids[k], n })).filter(r => !admins.has(r.sid)).sort((a, b) => b.n - a.n);
  add({ id: 'owners', sev: 'info', title: 'Folder owners who are not administrators', count: ownRows.length,
    desc: 'The owner can always change permissions on their folder, even without an explicit permission. Usually the folder creator.',
    cols: ['Owner', 'Folders', 'Account'],
    rows: ownRows.map(r => { const p = D.P.get(r.sid); return [pLink(r.sid), fmtN(r.n), p ? (p.type === 'orphan' ? el('span', { class: 'tag off' }, 'deleted') : p.type === 'user' && !p.enabled ? el('span', { class: 'tag off' }, 'disabled') : p.type) : '']; }),
    csv: ownRows.map(r => [pName(r.sid), r.n]), csvHead: ['Owner', 'Folders'] });

  // 11. unused / empty groups in ACLs
  const emptyG = [...D.aclSids].map(s => D.P.get(s)).filter(p => p && p.type === 'group' && !p.sid.startsWith('S-1-5-32-') && recursiveUsers(p.sid).size === 0);
  add({ id: 'emptyg', sev: 'info', title: 'Groups in ACLs without users', count: emptyG.length,
    desc: 'The group is used in permissions but contains no users (including nested groups).',
    cols: ['Group', 'Explicit entries'],
    rows: emptyG.map(p => [pLink(p.sid), (D.explicitBySid.get(p.sid) || []).length]),
    csv: emptyG.map(p => [p.full, (D.explicitBySid.get(p.sid) || []).length]) });

  // 12. errors
  const er = D.errorsRows.filter(r => r.Stage === 'ACL' || r.Stage === 'ListDirs');
  const erPaths = [...new Set(er.map(r => r.Path))];

    'Folder level only: permissions on individual files are not evaluated. Snapshot from ' + snap + '.',
  ];
  for (const n of notes) { R.push([{ v: n, s: XS.muted }]); S1.merges.push(`A${R.length}:D${R.length}`); S1.heights[R.length - 1] = 30; }

  const sheets = [S1];

  /* ---- Entry points ---- */
  {
    const hdr = ['Folder', 'Level', 'Via', 'Deny', 'Subfolders', 'Files', 'Last modified'];
    const data = entries.map(i => { const a = D.acl[i]; const r = a ? c.res[a] : null; return [{ v: pth(i), s: XS.cell }, lvCell(c.lv[i]), { v: viaOf(a), s: XS.cell }, { v: r && r.ds.length ? 'yes' : '', s: XS.red }, { v: D.subSize[i] - 1, s: XS.num }, { v: Math.max(0, D.files[i]), s: XS.num }, { v: fmtD(D.lw[i]), s: XS.cell }]; });
    const tbl = tableBlock(1, hdr, data);
    sheets.push({ name: 'Entry points', widths: [90, 11, 46, 7, 12, 9, 18], rows: tbl.rows, freeze: 1, filter: tbl.filter });
  }
  /* ---- All folders ---- */
  {
    const hdr = ['Folder', 'Name', 'Depth', 'Level', 'Via', 'Deny', 'Inheritance off', 'Files', 'Last modified'];
    const data = all.map(i => { const a = D.acl[i]; const r = a ? c.res[a] : null; return [{ v: pth(i), s: XS.cell }, { v: D.name[i], s: XS.cell }, { v: D.depth[i], s: XS.num }, lvCell(c.lv[i]), { v: viaOf(a), s: XS.cell }, { v: r && r.ds.length ? 'yes' : '', s: XS.red }, { v: D.inhOff[i] ? 'yes' : '', s: XS.cell }, { v: Math.max(0, D.files[i]), s: XS.num }, { v: fmtD(D.lw[i]), s: XS.cell }]; });
    const tbl = tableBlock(1, hdr, data);
    sheets.push({ name: 'All folders', widths: [90, 32, 7, 11, 46, 7, 10, 9, 18], rows: tbl.rows, freeze: 1, filter: tbl.filter });
  }
  /* ---- Group membership ---- */
  {
    const groups = [...c.tok.keys()].filter(s => s !== sid);
    if (groups.length) {
      const hdr = ['Group', 'Type', 'Membership', 'Path', 'Grants access to folders'];
      const data = groups.sort((a, b) => pName(a).localeCompare(pName(b), undefined)).map(g => {
        const prev = c.tok.get(g); const gp = D.P.get(g);
        return [{ v: pName(g), s: XS.cell }, { v: gp ? (gp.scope || gp.type) : '', s: XS.cell }, { v: prev === sid ? 'direct' : prev === '*' ? 'implicit (all users)' : 'nested', s: XS.cell }, { v: chainText(c.tok, g, sid), s: XS.cell }, { v: grantCount.get(g) || 0, s: XS.num }];
      });
      const tbl = tableBlock(1, hdr, data);
      sheets.push({ name: 'Groups', widths: [40, 16, 18, 60, 14], rows: tbl.rows, freeze: 1, filter: tbl.filter });
    }
  }
  /* ---- Members (for groups) ---- */
  if (p.type === 'group' || D.membersOf.has(sid)) {
    const users = [...recursiveUsers(sid)].map(s => D.P.get(s)).sort((a, b) => a.name.localeCompare(b.name, undefined));
    const direct = new Set(D.membersOf.get(sid) || []);
    const hdr = ['User', 'Account', 'Department', 'Status', 'Last logon', 'Membership'];
    const data = users.map(u => [{ v: u.name, s: XS.cell }, { v: u.full, s: XS.cell }, { v: u.dept || '', s: XS.cell }, { v: u.enabled ? 'Enabled' : 'Disabled', s: u.enabled ? XS.cell : XS.red }, { v: fmtD(u.lastLogon) || 'never', s: XS.cell }, { v: direct.has(u.sid) ? 'direct' : 'nested', s: XS.cell }]);
    const tbl = tableBlock(1, hdr, data);
    sheets.push({ name: 'Members', widths: [30, 30, 24, 10, 18, 12], rows: tbl.rows, freeze: 1, filter: tbl.filter });
  }
  const blob = await buildXlsx(sheets);
  const nm = safeName(p.type === 'user' ? p.sam : pShort(sid)).replace(/\s+/g, '_');
  saveBlob(blob, `Access_${nm}_${(D.meta.EndUtc || '').slice(0, 10)}.xlsx`);
  console.log('xlsx ms', Math.round(performance.now() - t0), 'rows', all.length, 'bytes', blob.size);
  toast('Excel saved');
}

/* ====================================================================
   Boot
   ==================================================================== */
(function boot() {
  const drop = $('#drop'), file = $('#file');
  $('#pickBtn').onclick = () => file.click();
  file.onchange = () => file.files.length && loadFiles([...file.files]);
  ['dragenter', 'dragover'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('drag'); }));
  ['dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); if (ev === 'drop' || e.target === document.documentElement) drop.classList.remove('drag'); }));
  document.addEventListener('drop', e => { const f = [...(e.dataTransfer?.files || [])]; if (f.length && !D) loadFiles(f); });
  $('#reloadBtn').onclick = () => location.reload();
  try { const w = localStorage.getItem('fsa-detw'); if (w) document.documentElement.style.setProperty('--detw', w.trim()); } catch (e) {}
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape' || !D || e.target.matches('input, select, textarea')) return;
    if (S.tab === 'tree' && $('#v-tree').classList.contains('det')) { closeDetails('tree'); return; }
    if (S.tab === 'folders' && $('#v-folders').classList.contains('det')) { closeDetails('folders'); return; }
    if (S.tab === 'compare' && $('#v-compare').classList.contains('det')) { closeDetails('compare'); return; }
    if ((S.tab === 'tree' || S.tab === 'graph') && S.sel) deselect();
  });
  let theme = null; try { theme = localStorage.getItem('fsa-theme'); } catch (e) {}
  if (theme) document.documentElement.dataset.theme = theme;
  $('#themeBtn').onclick = () => {
    const dark = matchMedia('(prefers-color-scheme: dark)').matches;
    const cur = document.documentElement.dataset.theme || (dark ? 'dark' : 'light');
    const nx = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = nx; try { localStorage.setItem('fsa-theme', nx); } catch (e) {}
    if (D && S.tab === 'graph') renderGraphView();
  };
  window.addEventListener('resize', () => { if (D && S.tab === 'graph') { clearTimeout(boot._t); boot._t = setTimeout(renderGraphView, 200); } });
})();
</script>
